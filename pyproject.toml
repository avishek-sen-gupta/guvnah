[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guvnah"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
